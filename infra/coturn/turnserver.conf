# Coturn Configuration for ShareApp (Section 3.7, Section 9)
# High-security, anti-loopback, multi-transport TURN server

# Ports
listening-port=3478
tls-listening-port=5349
alt-tls-listening-port=443

# Relay UDP Port Range (Section 9)
min-port=49152
max-port=65535

# Fingerprint in all STUN/TURN packets
fingerprint

# Coturn REST-style shared secret authentication (Section 3.7)
use-auth-secret
static-auth-secret=CHANGEME_SECURE_RANDOM_LONG_SECRET_KEY
realm=turn.example.com

# TLS Certificates (Let's Encrypt)
cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem

# Modern TLS protocols only
no-tlsv1
no-tlsv1_1

# Security & Anti-Abuse (Section 9)
# Block TURN from relaying into private or loopback ranges
no-loopback-peers
no-multicast-peers

denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff::
denied-peer-ip=fe80::-febf::

# Quotas and Rate Limits
user-quota=100
total-quota=2000
bps-capacity=0

# Disable CLI console for security
no-cli

# Logging (Rotate, NO payload data logged)
log-file=/var/log/turnserver/turnserver.log
simple-log
no-stdout-log
