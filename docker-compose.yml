# Self-hosting: Mog Share server + coturn TURN relay for strict NATs.
#
#   TURN_USER=mog TURN_PASS=change-me docker compose up -d
#
# Then build the client with:
#   VITE_TURN_URL=turn:YOUR_HOST:3478 VITE_TURN_USER=mog VITE_TURN_PASS=change-me

services:
  mogshare:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      # - CORS_ORIGINS=https://your-client.example.com

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command: >
      -n
      --log-file=stdout
      --lt-cred-mech
      --fingerprint
      --realm=mogshare
      --listening-port=3478
      --min-port=49160
      --max-port=49200
      --user=${TURN_USER:-mog}:${TURN_PASS:-change-me}
