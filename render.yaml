services:
  - type: web
    name: mog-share
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      # Optional TURN (strict NATs / mobile data). Leave unset to use public STUN only.
      # - key: COTURN_REALM      # e.g. turn.yourdomain.com
      # - key: COTURN_SECRET     # same value as coturn static-auth-secret
